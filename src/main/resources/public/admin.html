<!DOCTYPE html>
<html lang="en">
<head>
<title>Administrator Dashboard - QR Attendance</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<main class="wrap">
  <div class="page-head"><h1>Administrator dashboard</h1><p class="sub">Manage accounts and rooms, and review attendance reports.</p></div>
  <div class="stats" id="stats"></div>
  <section class="card no-print">
    <h2><i class="bi bi-people"></i> User accounts</h2>
    <div id="users" class="table-wrap"></div>
  </section>
  <section class="card no-print">
    <h2><i class="bi bi-building"></i> Rooms</h2>
    <form id="roomForm" class="toolbar">
      <input id="rCode" placeholder="Code (RM-201)" required>
      <input id="rName" placeholder="Room name" required>
      <input id="rBuilding" placeholder="Building" required>
      <input id="rFloor" placeholder="Floor">
      <input id="rCap" type="number" min="0" placeholder="Capacity">
      <button class="btn" type="submit"><i class="bi bi-plus-lg"></i> Add room</button>
    </form>
    <div id="rooms" class="table-wrap"></div>
  </section>
  <section class="card">
    <h2><i class="bi bi-clipboard-data"></i> Attendance reports</h2>
    <div class="toolbar">
      <input id="q" placeholder="Search teacher or room">
      <select id="status"><option value="">All statuses</option><option value="ACTIVE">Active</option><option value="COMPLETED">Completed</option></select>
      <input type="date" id="date">
      <button class="btn ghost" id="print"><i class="bi bi-printer"></i> Print report</button>
    </div>
    <div id="history"></div>
  </section>
</main>
<script src="js/core.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
