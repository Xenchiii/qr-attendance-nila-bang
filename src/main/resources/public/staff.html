<!DOCTYPE html>
<html lang="en">
<head>
<title>Staff Dashboard - QR Attendance</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<main class="wrap">
  <div class="page-head"><h1>Staff dashboard</h1><p class="sub">Scan a teacher's QR code to record Time In and monitor rooms in use.</p></div>
  <div class="cols">
    <section class="card no-print">
      <h2><i class="bi bi-upc-scan"></i> Scan QR code</h2>
      <div id="reader" class="hidden"></div>
      <button class="btn block" id="scanBtn"><i class="bi bi-camera"></i> Start camera</button>
      <label class="field" style="margin-top:1rem">Or enter the code manually
        <div style="display:flex;gap:.5rem"><input id="manual" placeholder="Paste the QR code text"><button class="btn" id="manualBtn" type="button">Submit</button></div>
      </label>
      <div class="msg hidden" id="result"></div>
    </section>
    <section class="card">
      <h2><i class="bi bi-door-open"></i> Rooms in use</h2>
      <div id="rooms" class="table-wrap"></div>
    </section>
  </div>
  <section class="card" style="margin-top:1.25rem">
    <h2><i class="bi bi-clipboard-data"></i> Attendance history</h2>
    <div class="toolbar">
      <input id="q" placeholder="Search teacher or room">
      <select id="status"><option value="">All statuses</option><option value="ACTIVE">Active</option><option value="COMPLETED">Completed</option></select>
      <input type="date" id="date">
      <button class="btn ghost" id="print"><i class="bi bi-printer"></i> Print</button>
    </div>
    <div id="history"></div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="js/core.js"></script>
<script src="js/staff.js"></script>
</body>
</html>
