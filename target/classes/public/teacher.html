<!DOCTYPE html>
<html lang="en">
<head>
<title>Teacher Dashboard - QR Attendance</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<main class="wrap">
  <div class="page-head"><h1>Teacher dashboard</h1><p class="sub">Choose your room, generate a QR code, and show it to staff to time in.</p></div>
  <div class="cols">
    <section class="card">
      <h2><i class="bi bi-qr-code"></i> Generate QR code</h2>
      <label class="field">Room or facility<select id="room"></select></label>
      <button class="btn block" id="gen"><i class="bi bi-qr-code"></i> Generate QR code</button>
      <div class="qr-box hidden" id="qrBox">
        <div id="qr"></div>
        <div class="timer" id="timer"></div>
        <p class="sub">Staff scan this code to record your Time In.</p>
      </div>
    </section>
    <section class="card">
      <h2><i class="bi bi-clock-history"></i> My attendance</h2>
      <div id="history"></div>
    </section>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/core.js"></script>
<script src="js/teacher.js"></script>
</body>
</html>
